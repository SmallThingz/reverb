// Opt-in, isolated on-device reliability tests. Never replaces the user's Reverb install.
allprojects {
    plugins.withId('com.android.application') {
        def parityOnly = providers.gradleProperty('reverbNativeParity')
            .map { it.toBoolean() }.getOrElse(false)
        android {
            buildTypes {
                reliability {
                    initWith debug
                    applicationIdSuffix parityOnly ? '.nativeparity.reliability' : '.reliability'
                    matchingFallbacks = ['debug']
                    manifestPlaceholders += [
                        reliabilityApplicationClass: parityOnly ?
                            'android.app.Application' : 'app.smallthingz.reverb.ReverbApplication',
                        reliabilityAppLabel: parityOnly ? 'Reverb native parity' : '@string/app_name',
                        reliabilityMainEnabled: parityOnly ? 'false' : 'true',
                    ]
                }
            }
        }
        if (parityOnly) {
            def oracleCheck = tasks.register('verifyNativeParityOracle') {
                def settingsSource = file('src/main/java/app/smallthingz/reverb/SettingsScreen.kt')
                def chromeSource = file('src/main/java/app/smallthingz/reverb/AppSurfaceStyle.kt')
                def iconsSource = file('src/main/java/app/smallthingz/reverb/AppIcons.kt')
                def aboutOracleSources = [
                    'src/main/java/app/smallthingz/reverb/AboutDialog.kt': '882fa4e8540ff8d0b02391644bcda12e4a8f23ad0c22597d49bfcb22bb2bf77b',
                    'src/main/java/app/smallthingz/reverb/PredictiveBackMotion.kt': 'fc977cc4f385def455abe021faf4635a87b6df85cd95de4885a8a1a128fd4d24',
                    'src/main/java/app/smallthingz/reverb/ReverbBrandMark.kt': 'c594b341689a9d8f881b2e170d72b8f2e178d1ccbfe612c515188a8287c7699e',
                    'src/main/java/app/smallthingz/reverb/AppSurfaceStyle.kt': '6291bd9706506e050f0007a17fedd34968c551205eca9c6eb9230fcec1ad6187',
                    'src/main/java/app/smallthingz/reverb/AppFeedback.kt': 'dedfdcf5b6e5a82fedfe4147d7fbcde240cab7a414bd601199a2d86a8e0a0518',
                    'src/main/java/app/smallthingz/reverb/AppIcons.kt': 'baeb2191e2c0e3c98de368c2ab112044abc719f2888fe5527c23d3fab4643273',
                ]
                inputs.files(aboutOracleSources.keySet().collect { file(it) })
                // Generated normal-Home oracle keeps released leaf bodies; only explicit
                // service-presence seams and QA symbol names differ (generator/provenance retained).
                def homeOracleSources = [
                    'src/reliability/java/app/smallthingz/reverb/ReleasedHomeFixtureOracle.kt': '5acd675302d79e1aad10f5ec603fce7d631b164834c7cd9e0773bfdc5ab5b5c1',
                    'src/main/java/app/smallthingz/reverb/AppTopBar.kt': '99b9f06505865ab5c72a454801e5be78fdb9e2263b1a3c01f0846111a43f5670',
                    'src/main/java/app/smallthingz/reverb/AudioBlobView.kt': '85baca91d5e481a8d49d8c6d40d70797c25920755b0d2b03ea50e975d0318de8',
                    'src/main/java/app/smallthingz/reverb/ReverbTheme.kt': 'a4d9e0e131dc477c586a5790cde43604a067d878bf0cc8f677a88c6de05945c1',
                ]
                inputs.files(homeOracleSources.keySet().collect { file(it) })
                def onboardingScreenOracle = file('src/reliability/java/app/smallthingz/reverb/ReleasedOnboardingScreenOracle.kt')
                inputs.file(onboardingScreenOracle)
                inputs.files(settingsSource, chromeSource, iconsSource)
                doLast {
                    def source = settingsSource.getText('UTF-8')
                    def start = source.indexOf('@Composable\ninternal fun SettingsAudioGroup(')
                    def end = source.indexOf('@Composable\nprivate fun <T> SettingsDropdown(', start)
                    if (start < 0 || end <= start) {
                        throw new GradleException('Released group oracle declarations were moved or removed')
                    }
                    def sha256 = { byte[] bytes ->
                        java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
                    }
                    aboutOracleSources.each { relative, expected ->
                        if (sha256(file(relative).bytes) != expected) {
                            throw new GradleException('Released About oracle changed: ' + relative)
                        }
                    }
                    homeOracleSources.each { relative, expected ->
                        if (sha256(file(relative).bytes) != expected) {
                            throw new GradleException('Released Home oracle changed: ' + relative)
                        }
                    }
                    if (sha256(onboardingScreenOracle.bytes) !=
                            '8be65c8c589678c3a5393d4cb7a73489af942e3a04cf0958845bbad5fc4c72a9') {
                        throw new GradleException('Released onboarding screen oracle changed')
                    }
                    if (sha256(source.substring(start, end).getBytes('UTF-8')) !=
                            '807f2fdde7f224c91153de4b74c5c03c0713bdf41689a58c984951fad1d51952' ||
                        sha256(chromeSource.bytes) !=
                            '6291bd9706506e050f0007a17fedd34968c551205eca9c6eb9230fcec1ad6187' ||
                        sha256(iconsSource.bytes) !=
                            'baeb2191e2c0e3c98de368c2ab112044abc719f2888fe5527c23d3fab4643273') {
                        throw new GradleException(
                            'Native parity oracle changed from released v0.1.2; do not qualify against a rewritten reference'
                        )
                    }
                }
            }
            tasks.matching { it.name == 'preReliabilityBuild' }.configureEach {
                dependsOn oracleCheck
            }
        }
    }
}
