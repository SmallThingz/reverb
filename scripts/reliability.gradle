// Opt-in, isolated on-device reliability tests. Never replaces the user's Reverb install.
// Set before project buildscript evaluation: normal builds do not load the Compose plugin.
gradle.ext.reverbReliabilityEnabled = gradle.startParameter.taskNames.any {
    it.tokenize(':').last().toLowerCase(java.util.Locale.ROOT).contains('reliability')
}
allprojects {
    plugins.withId('com.android.application') {
        def parityOnly = providers.gradleProperty('reverbNativeParity')
            .map { it.toBoolean() }.getOrElse(false)
        def nativeEntryLifecycle = providers.gradleProperty('reverbNativeEntryLifecycle')
            .map { it.toBoolean() }.getOrElse(false)
        if (nativeEntryLifecycle && !parityOnly) {
            throw new GradleException('reverbNativeEntryLifecycle requires reverbNativeParity=true')
        }
        android {
            buildTypes {
                reliability {
                    initWith debug
                    applicationIdSuffix parityOnly ? '.nativeparity.reliability' : '.reliability'
                    matchingFallbacks = ['debug']
                    manifestPlaceholders += [
                        reliabilityApplicationClass: parityOnly ?
                            'android.app.Application' : 'app.smallthingz.reverb.ReverbApplication',
                        reliabilityAppLabel: parityOnly ? 'Reverb native parity' : '@string/app_name',
                        reliabilityMainEnabled: parityOnly ? nativeEntryLifecycle.toString() : 'true',
                        reliabilityMainExported: nativeEntryLifecycle ? 'false' : 'true',
                        reliabilityEntryEnabled: nativeEntryLifecycle.toString(),
                    ]
                }
            }
        }
        // AGP 9.4 enables unit tests only for testBuildType (debug) by default.
        // Keep the opt-in oracle tests on their own dependency/source classpath.
        androidComponents.beforeVariants(androidComponents.selector().withBuildType('reliability')) { variant ->
            variant.hostTests.get('UnitTest').enable = true
        }
        dependencies {
            // The QA font probe exercises EmojiCompat initialization directly.
            reliabilityImplementation 'androidx.emoji2:emoji2:1.4.0'
            reliabilityImplementation 'androidx.activity:activity-compose:1.13.0'
            reliabilityImplementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
            reliabilityImplementation platform('androidx.compose:compose-bom:2026.05.01')
            reliabilityImplementation 'androidx.compose.animation:animation'
            reliabilityImplementation 'androidx.compose.foundation:foundation'
            reliabilityImplementation 'androidx.compose.material:material-icons-core'
            reliabilityImplementation 'androidx.compose.material:material-icons-extended'
            reliabilityImplementation 'androidx.compose.material3:material3'
            reliabilityImplementation 'androidx.compose.ui:ui'
            reliabilityImplementation 'androidx.compose.ui:ui-tooling-preview'
        }
        if (parityOnly) {
            def oracleCheck = tasks.register('verifyNativeParityOracle') {
                def settingsSource = file('src/main/java/app/smallthingz/reverb/SettingsScreen.kt')
                def chromeSource = file('src/reliability/java/app/smallthingz/reverb/AppSurfaceStyle.kt')
                def iconsSource = file('src/reliability/java/app/smallthingz/reverb/AppIcons.kt')
                def aboutOracleSources = [
                    'src/reliability/java/app/smallthingz/reverb/AboutDialog.kt': '882fa4e8540ff8d0b02391644bcda12e4a8f23ad0c22597d49bfcb22bb2bf77b',
                    'src/main/java/app/smallthingz/reverb/PredictiveBackMotion.kt': 'fc977cc4f385def455abe021faf4635a87b6df85cd95de4885a8a1a128fd4d24',
                    'src/reliability/java/app/smallthingz/reverb/ReverbBrandMark.kt': 'c594b341689a9d8f881b2e170d72b8f2e178d1ccbfe612c515188a8287c7699e',
                    'src/reliability/java/app/smallthingz/reverb/AppSurfaceStyle.kt': '6291bd9706506e050f0007a17fedd34968c551205eca9c6eb9230fcec1ad6187',
                    'src/main/java/app/smallthingz/reverb/AppFeedback.kt': 'dedfdcf5b6e5a82fedfe4147d7fbcde240cab7a414bd601199a2d86a8e0a0518',
                    'src/reliability/java/app/smallthingz/reverb/AppIcons.kt': 'baeb2191e2c0e3c98de368c2ab112044abc719f2888fe5527c23d3fab4643273',
                ]
                inputs.files(aboutOracleSources.keySet().collect { file(it) })
                // Generated normal-Home oracle keeps released leaf bodies; only explicit
                // service-presence seams and QA symbol names differ (generator/provenance retained).
                def homeOracleSources = [
                    'src/reliability/java/app/smallthingz/reverb/ReleasedHomeFixtureOracle.kt': '5acd675302d79e1aad10f5ec603fce7d631b164834c7cd9e0773bfdc5ab5b5c1',
                    'src/reliability/java/app/smallthingz/reverb/AppTopBar.kt': '99b9f06505865ab5c72a454801e5be78fdb9e2263b1a3c01f0846111a43f5670',
                    'src/main/java/app/smallthingz/reverb/AudioBlobView.kt': '85baca91d5e481a8d49d8c6d40d70797c25920755b0d2b03ea50e975d0318de8',
                    'src/reliability/java/app/smallthingz/reverb/ReverbTheme.kt': 'a4d9e0e131dc477c586a5790cde43604a067d878bf0cc8f677a88c6de05945c1',
                ]
                inputs.files(homeOracleSources.keySet().collect { file(it) })
                // Full release Main/Library entries are mechanically renamed, never reconstructed.
                // Shared render leaves retain their exact release bytes (visibility-only exception below).
                def screenOracleSources = [
                    'src/reliability/java/app/smallthingz/reverb/ReleasedMainScreenParityOracle.kt': '614856c6ad8a0a54027c932d44f1361003e73f1bf7faafaf7b902e9e8c6d117f',
                    'src/main/java/app/smallthingz/reverb/SettingsScreen.kt': 'bff24a7b03c52f3235bca98d5c2c4da78a2f7ed369bcdb9c9195e2a8d66c92cc',
                    'src/reliability/java/app/smallthingz/reverb/ReleasedRangeFixtureOracle.kt': 'cf325e83be5dfacc7a48725a5210d36fcf5f971d1c4617ca5843c65f5011b73b',
                    'src/main/java/app/smallthingz/reverb/ProgressiveWaveform.kt': '161a7086e1d49222626e2b725868fb8eb1f2489781733eb6df3e59d9822b904c',
                    'src/main/java/app/smallthingz/reverb/RangeDurationWheelView.kt': 'fb2b3b433e5ce481f84d17d2206408bb8db7593d78bf484abf7e9fb7870ab62a',
                    'src/reliability/java/app/smallthingz/reverb/ReleasedLibraryFilesScreen.kt': 'eee4b6985bb0ada6b8127a49ea4925055afe46bb8ea75cb067780c02e4503489',
                    'src/main/java/app/smallthingz/reverb/RecordingCard.kt': '85b5ad0f9f97b63a57024933e8b5723050ebf5cbcbfde3f7807231c7e04d1b42',
                ]
                inputs.files(screenOracleSources.keySet().collect { file(it) })
                def rangeRendererSource = file('src/main/java/app/smallthingz/reverb/RangeExportEditor.kt')
                def inlinePlayerSource = file('src/main/java/app/smallthingz/reverb/RecordingInlinePlayer.kt')
                inputs.files(rangeRendererSource, inlinePlayerSource)
                def onboardingScreenOracle = file('src/reliability/java/app/smallthingz/reverb/ReleasedOnboardingScreenOracle.kt')
                inputs.file(onboardingScreenOracle)
                inputs.files(settingsSource, chromeSource, iconsSource)

                // Mechanical native-entry split: renderer source is QA-only, release bytes pinned.
                def releasedMainOracle = file('src/reliability/java/app/smallthingz/reverb/ReleasedMainActivityOracle.kt')
                def extractedMainPanelPolicy = file('src/main/java/app/smallthingz/reverb/MainPanelPolicy.kt')
                inputs.files(releasedMainOracle, extractedMainPanelPolicy)
                // Finite mechanical split: reconstruct original bytes from actual compiled files.
                def splitSourceMapFile = rootProject.file('scripts/native-renderer-source-map.json')
                def splitSourceMap = new groovy.json.JsonSlurper().parse(splitSourceMapFile)
                inputs.file(splitSourceMapFile)
                inputs.files(splitSourceMap.outputs_sha256.keySet().collect { file(it) })
                def backendSourceMapFile = rootProject.file('scripts/native-backend-source-map.json')
                def backendSourceMap = new groovy.json.JsonSlurper().parse(backendSourceMapFile)
                inputs.file(backendSourceMapFile)
                inputs.files((backendSourceMap.normalizations.keySet() + backendSourceMap.references.keySet())
                    .collect { file(it) })
                doLast {
                    def splitSha256 = { byte[] bytes ->
                        java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
                    }
                    if (splitSha256(splitSourceMapFile.bytes) != '441a3c805dadb0711e79b72d132cf4151c431eaa1f63b8a393c7c104442f90e0') {
                        throw new GradleException('Native renderer split manifest changed')
                    }
                    // Native backends change namespaces; QA keeps pinned old implementations.
                    // Invert only declared mechanical seams, then apply every original release hash.
                    if (splitSha256(backendSourceMapFile.bytes) != 'be124a0680033b389d3529d63b80b39e2b62c9e1eb3262bb92412b0f7eb56a68') {
                        throw new GradleException('Native backend source manifest changed')
                    }
                    def backendNormalizedBytes = [:]
                    def nativeBackendBytes = { relative ->
                        if (!backendNormalizedBytes.containsKey(relative)) {
                            byte[] bytes = file(relative).bytes
                            def definition = backendSourceMap.normalizations[relative] ?:
                                backendSourceMap.references[relative]
                            if (definition != null) {
                                if (splitSha256(bytes) != definition.compiled_sha256) {
                                    throw new GradleException('Native backend compiled source changed: ' + relative)
                                }
                                def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
                                definition.inverse.each { replacement ->
                                    def expression = java.util.regex.Pattern.quote(replacement.from as String)
                                    if (replacement.word) expression = '\\b' + expression + '\\b'
                                    def matcher = java.util.regex.Pattern.compile(expression).matcher(text)
                                    int count = 0
                                    while (matcher.find()) count++
                                    if (count != (replacement.count as int)) {
                                        throw new GradleException('Native backend mechanical seam changed: ' + relative)
                                    }
                                    text = matcher.reset().replaceAll(
                                        java.util.regex.Matcher.quoteReplacement(replacement.to as String))
                                }
                                bytes = text.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                                if (splitSha256(bytes) != definition.normalized_sha256) {
                                    throw new GradleException('Native backend no longer reconstructs pinned source: ' + relative)
                                }
                            }
                            backendNormalizedBytes[relative] = bytes
                        }
                        backendNormalizedBytes[relative]
                    }
                    backendSourceMap.references.keySet().each { nativeBackendBytes(it) }
                    def splitActualBytes = [:]
                    splitSourceMap.outputs_sha256.each { relative, expected ->
                        def bytes = nativeBackendBytes(relative)
                        if (splitSha256(bytes) != expected) {
                            throw new GradleException('Native renderer split output changed: ' + relative)
                        }
                        splitActualBytes[relative] = bytes
                    }
                    def normalizedSplitBytes = [:]
                    def readSplitBytes = { relative ->
                        if (!normalizedSplitBytes.containsKey(relative)) {
                            byte[] bytes = splitActualBytes.containsKey(relative) ?
                                splitActualBytes[relative] : nativeBackendBytes(relative)
                            def replacements = splitSourceMap.normalizations[relative] ?: []
                            if (!replacements.isEmpty()) {
                                def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
                                replacements.each { replacement ->
                                    if (text.count(replacement.from as String) != (replacement.count as int)) {
                                        throw new GradleException('Native split visibility seam changed: ' + relative)
                                    }
                                    text = text.replace(replacement.from as String, replacement.to as String)
                                }
                                bytes = text.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                            }
                            normalizedSplitBytes[relative] = bytes
                        }
                        normalizedSplitBytes[relative]
                    }
                    def originalSplitBytes = [:]
                    splitSourceMap.original_sources.each { original, definition ->
                        def stream = new java.io.ByteArrayOutputStream()
                        definition.parts.each { part ->
                            byte[] bytes = readSplitBytes(part.file)
                            int start = part.start as int
                            int length = part.length as int
                            if (start < 0 || length < 0 || start > bytes.length - length) {
                                throw new GradleException('Native split span outside source: ' + original)
                            }
                            stream.write(bytes, start, length)
                        }
                        byte[] reconstructed = stream.toByteArray()
                        if (splitSha256(reconstructed) != definition.sha256) {
                            throw new GradleException('Native split no longer reconstructs original: ' + original)
                        }
                        originalSplitBytes[original] = reconstructed
                    }
                    // The finite Settings leaf oracle is a declaration-only extraction of v0.1.2.
                    // Pin actual compiled output, invert only declared names/visibility, then compare
                    // its complete suffix with both the released span hash and reconstructed renderer.
                    splitSourceMap.declaration_oracles.each { relative, definition ->
                        def text = new String(splitActualBytes[relative], java.nio.charset.StandardCharsets.UTF_8)
                        definition.inverse.each { replacement ->
                            if (text.count(replacement.from as String) != (replacement.count as int)) {
                                throw new GradleException('Released declaration seam changed: ' + relative)
                            }
                            text = text.replace(replacement.from as String, replacement.to as String)
                        }
                        def marker = definition.start_marker as String
                        if (text.count(marker) != 1) {
                            throw new GradleException('Released declaration boundary changed: ' + relative)
                        }
                        byte[] body = text.substring(text.indexOf(marker)).getBytes(java.nio.charset.StandardCharsets.UTF_8)
                        def original = new String(originalSplitBytes[definition.reconstructed_source],
                            java.nio.charset.StandardCharsets.UTF_8)
                        if (original.count(marker) != 1) {
                            throw new GradleException('Original declaration boundary changed: ' + relative)
                        }
                        byte[] originalBody = original.substring(original.indexOf(marker))
                            .getBytes(java.nio.charset.StandardCharsets.UTF_8)
                        if (body.length != (definition.released_span_length as int) ||
                            splitSha256(body) != definition.body_sha256 ||
                            !java.util.Arrays.equals(body, originalBody)) {
                            throw new GradleException('Declaration no longer equals exact released source span: ' + relative)
                        }
                    }
                    def releasedOracleBytes = { relative ->
                        originalSplitBytes.containsKey(relative) ?
                            originalSplitBytes[relative] : nativeBackendBytes(relative)
                    }
                    def source = new String(releasedOracleBytes('src/main/java/app/smallthingz/reverb/SettingsScreen.kt'), 'UTF-8')
                    def start = source.indexOf('@Composable\ninternal fun SettingsAudioGroup(')
                    def end = source.indexOf('@Composable\nprivate fun <T> SettingsDropdown(', start)
                    if (start < 0 || end <= start) {
                        throw new GradleException('Released group oracle declarations were moved or removed')
                    }
                    def sha256 = { byte[] bytes ->
                        java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
                    }

                    if (sha256(nativeBackendBytes('src/reliability/java/app/smallthingz/reverb/ReleasedMainActivityOracle.kt')) != 'beca2d20a8a6230fb93e276cc370e8f86e08b605d40f60c4bb3698fdc1814090' ||
                        sha256(extractedMainPanelPolicy.bytes) != '4091efe78b45a42b4532c361b21de89c18cf9f4b1d1af9bf04bdf396949c4582') {
                        throw new GradleException('Released Main oracle/helper split changed')
                    }
                    def reconstructedReleasedMain = new String(nativeBackendBytes('src/reliability/java/app/smallthingz/reverb/ReleasedMainActivityOracle.kt'), 'UTF-8')
                        .replaceAll('\\bReleasedMainActivityOracle\\b', 'MainActivity')
                        .replaceAll('\\breleasedMainOraclePanelRevealProgress\\b', 'panelRevealProgress')
                        .replaceAll('\\breleasedMainOracleShouldCommitPanelReveal\\b', 'shouldCommitPanelReveal')
                        .replaceAll('\\breleasedMainOracleShouldComposeMainPanel\\b', 'shouldComposeMainPanel')
                    if (sha256(reconstructedReleasedMain.getBytes('UTF-8')) != '700410262137f40c16c327cc040b64f53de05ceebd8b14b9dd4d18f48cde5c15') {
                        throw new GradleException('Main oracle no longer reconstructs exact released v0.1.2 source')
                    }
                    aboutOracleSources.each { relative, expected ->
                        if (sha256(releasedOracleBytes(relative)) != expected) {
                            throw new GradleException('Released About oracle changed: ' + relative)
                        }
                    }
                    homeOracleSources.each { relative, expected ->
                        if (sha256(releasedOracleBytes(relative)) != expected) {
                            throw new GradleException('Released Home oracle changed: ' + relative)
                        }
                    }
                    screenOracleSources.each { relative, expected ->
                        if (sha256(releasedOracleBytes(relative)) != expected) {
                            throw new GradleException('Released Main/Range/Library oracle changed: ' + relative)
                        }
                    }
                    def rangeText = new String(releasedOracleBytes('src/main/java/app/smallthingz/reverb/RangeExportEditor.kt'), 'UTF-8')
                    def rangeStart = rangeText.indexOf('@Composable\ninternal fun RangeExportHomeContent(')
                    def fineSeekStart = rangeText.indexOf('internal fun SpringFineSeekControl(')
                    if (rangeStart < 0 || fineSeekStart < rangeStart ||
                        sha256(rangeText.substring(rangeStart).getBytes('UTF-8')) !=
                            '95d015effa1b5b4c317172fa6d5df4079af778bec3cf1a29db8a5579d4c1d5a5' ||
                        sha256(rangeText.substring(fineSeekStart).getBytes('UTF-8')) !=
                            'd9cbc224692db6c34fcca6c516f074b65621945e2d46a5cc7aebf531857f9a7e') {
                        throw new GradleException('Released range/FineSeek render suffix changed')
                    }
                    def normalizedPlayer = new String(releasedOracleBytes('src/main/java/app/smallthingz/reverb/RecordingInlinePlayer.kt'), 'UTF-8')
                        .replace('internal data class InlinePlayerMediaSource(', 'private data class InlinePlayerMediaSource(')
                        .replace('internal fun openInlinePlayerMediaSource(', 'private fun openInlinePlayerMediaSource(')
                    if (sha256(normalizedPlayer.getBytes('UTF-8')) !=
                            'be40d98c8b619c4920ca5b102ad8d38b6d0a7239bca6ed3a08110cce56f78423') {
                        throw new GradleException('Released inline-player oracle changed beyond the two visibility seams')
                    }
                    if (sha256(nativeBackendBytes('src/reliability/java/app/smallthingz/reverb/ReleasedOnboardingScreenOracle.kt')) !=
                            '8be65c8c589678c3a5393d4cb7a73489af942e3a04cf0958845bbad5fc4c72a9') {
                        throw new GradleException('Released onboarding screen oracle changed')
                    }
                    if (sha256(source.substring(start, end).getBytes('UTF-8')) !=
                            '807f2fdde7f224c91153de4b74c5c03c0713bdf41689a58c984951fad1d51952' ||
                        sha256(chromeSource.bytes) !=
                            '6291bd9706506e050f0007a17fedd34968c551205eca9c6eb9230fcec1ad6187' ||
                        sha256(iconsSource.bytes) !=
                            'baeb2191e2c0e3c98de368c2ab112044abc719f2888fe5527c23d3fab4643273') {
                        throw new GradleException(
                            'Native parity oracle changed from released v0.1.2; do not qualify against a rewritten reference'
                        )
                    }
                }
            }
            tasks.matching { it.name == 'preReliabilityBuild' }.configureEach {
                dependsOn oracleCheck
            }
        }
    }
}
