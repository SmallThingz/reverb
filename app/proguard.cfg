-dontobfuscate
-allowaccessmodification
-keepattributes SourceFile,LineNumberTable
-keepattributes SourceDebugExtension

-maximumremovedandroidloglevel 6

-assumenosideeffects class android.util.Log {
    public static *** v(...);
    public static *** d(...);
    public static *** i(...);
    public static *** w(...);
    public static *** e(...);
    public static *** wtf(...);
    public static boolean isLoggable(...);
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Released 0.1.2 serialized these two names. They are app-owned data-only readers,
# not Compose dependencies. Future state uses the native Bundle schema.
-keep class androidx.compose.runtime.ParcelableSnapshotMutableState {
    public static final android.os.Parcelable$ClassLoaderCreator CREATOR;
    # Keep the cold policy-error path from outlining helpers into this legacy namespace.
    public <init>(java.lang.Object, int);
}
-keep class androidx.compose.runtime.ParcelableSnapshotMutableIntState {
    public static final android.os.Parcelable$Creator CREATOR;
}
