apply plugin: 'com.android.application'
if (gradle.ext.has('reverbReliabilityEnabled') && gradle.ext.reverbReliabilityEnabled) {
    apply plugin: 'org.jetbrains.kotlin.plugin.compose'
}

repositories {
    google()
    mavenCentral()
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add('-jvm-default=no-compatibility')
    }
}

def releaseStoreFilePath = findProperty('RELEASE_STORE_FILE') ?: 'release.keystore'
def releaseStorePassword = findProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = findProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = findProperty('RELEASE_KEY_PASSWORD')
def releaseSigningReady =
    file(releaseStoreFilePath).exists() &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

android {
    namespace = 'app.smallthingz.reverb'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig{
        applicationId "app.smallthingz.reverb"
        minSdk = 28
        targetSdk = 37
        versionCode 5
        versionName "0.1.3-rc1"
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFile file('proguard.cfg')
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }

        debug {
        }
    }
    buildFeatures {
        buildConfig = false
        compose = gradle.ext.has('reverbReliabilityEnabled') && gradle.ext.reverbReliabilityEnabled
    }
    sourceSets {
        // Never combine these two legacy wire-name readers with the QA Compose runtime.
        debug.java.srcDir 'src/nativeCompatibility/java'
        release.java.srcDir 'src/nativeCompatibility/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        dex {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/LICENSE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.version',
                'META-INF/androidx/**',
                'META-INF/version-control-info.textproto',
                'kotlin-tooling-metadata.json',
            ]
        }
    }

}

if (releaseSigningReady) {
    def releaseVersionName = android.defaultConfig.versionName
    def releaseTag = "v${releaseVersionName}"
    def headCommit = providers.exec {
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText.get().trim()
    def tagCommit = providers.exec {
        commandLine 'git', 'rev-parse', "${releaseTag}^{commit}"
    }.standardOutput.asText.get().trim()
    def dirtyTree = providers.exec {
        commandLine 'git', 'status', '--porcelain', '--untracked-files=all'
    }.standardOutput.asText.get().trim()

    if (headCommit != tagCommit || !dirtyTree.isEmpty()) {
        throw new GradleException(
            "Refusing to sign ${releaseVersionName}: release builds require a clean HEAD exactly at ${releaseTag}"
        )
    }
}

// The native icon library is generated from these pinned source packs. They are
// explicit reference inputs, never part of a production compile/runtime classpath.
configurations {
    nativeIconSources {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

// NavigationEvent's four immutable DTOs carry binary-only Compose annotations.
// Native variants do not run the Compose compiler or need that annotation jar;
// retain the real annotation/runtime dependency in the isolated QA classpaths.
configurations.configureEach { configuration ->
    if (configuration.name ==~ /(?:debug|release)(?:UnitTest)?(?:Compile|Runtime)Classpath/) {
        configuration.exclude group: 'androidx.compose.runtime', module: 'runtime-annotation'
        configuration.exclude group: 'androidx.compose.runtime', module: 'runtime-annotation-android'
    }
}

dependencies {
    implementation project(':native-ui')
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    nativeIconSources 'androidx.compose.material:material-icons-core-android:1.7.8:sources@jar'
    nativeIconSources 'androidx.compose.material:material-icons-extended-android:1.7.8:sources@jar'
    testImplementation 'junit:junit:4.13.2'
}
